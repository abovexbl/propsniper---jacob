<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PropSniper · +EV Operations Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0d0f14;--panel:#14171f;--panel-2:#1a1e28;--line:#252b38;--txt:#e8ebf2;--muted:#8b93a7;
      --cyan:#2ee6d6;--violet:#8b5cf6;--amber:#f5a623;--red:#ff5470;--green:#36d399;}
    *{box-sizing:border-box;} body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b2030 0%,var(--bg) 55%);
      color:var(--txt);font-family:"Nunito Sans",system-ui,sans-serif;min-height:100vh;}
    .wrap{max-width:1240px;margin:0 auto;padding:26px 22px 90px;}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
    .eyebrow{font-family:"JetBrains Mono",monospace;color:var(--cyan);letter-spacing:.22em;text-transform:uppercase;font-size:12px;}
    h1{font-family:"Syne",sans-serif;font-weight:800;font-size:38px;margin:6px 0 2px;
      background:linear-gradient(92deg,var(--cyan),var(--violet) 60%,var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .sub{color:var(--muted);font-size:13px;}
    .meta{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);margin-top:6px;}
    .live{display:inline-flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--green);
      border:1px solid rgba(54,211,153,.4);background:rgba(54,211,153,.08);padding:8px 12px;border-radius:999px;}
    .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);animation:p 2s infinite;}
    @keyframes p{0%{box-shadow:0 0 0 0 rgba(54,211,153,.6);}70%{box-shadow:0 0 0 8px rgba(54,211,153,0);}100%{box-shadow:0 0 0 0 rgba(54,211,153,0);}}
    .verdict{display:inline-flex;align-items:center;gap:10px;margin:16px 0 22px;padding:10px 16px;border-radius:10px;
      font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;border:1px solid var(--line);flex-wrap:wrap;}
    .verdict.v0{background:rgba(54,211,153,.12);color:var(--green);border-color:rgba(54,211,153,.4);}
    .verdict.v1{background:rgba(245,166,35,.12);color:var(--amber);border-color:rgba(245,166,35,.4);}
    .verdict.v2,.verdict.v3{background:rgba(255,84,112,.12);color:var(--red);border-color:rgba(255,84,112,.4);}
    .verdict small{color:var(--muted);font-weight:400;}
    .dot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
    .card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden;}
    .card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--violet));opacity:.8;}
    .card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;}
    .card .num{font-family:"Syne",sans-serif;font-weight:800;font-size:40px;line-height:1.05;margin-top:6px;}
    .card.alert .num{color:var(--red);} .card.ok .num{color:var(--green);}
    .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
    .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;}
    .seg button{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);background:none;border:none;padding:7px 13px;border-radius:8px;cursor:pointer;}
    .seg button.on{background:linear-gradient(92deg,var(--cyan),var(--violet));color:#0d0f14;font-weight:700;}
    .seglabel{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 18px;flex-wrap:wrap;}
    .tabs button{font-family:"Syne",sans-serif;font-size:15px;font-weight:600;color:var(--muted);background:none;border:none;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;}
    .tabs button.on{color:var(--txt);border-bottom-color:var(--cyan);}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .chip{font-family:"JetBrains Mono",monospace;font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;}
    th.sortable:hover{color:var(--txt);} th .arrow{color:var(--cyan);}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
    tr:hover td{background:rgba(255,255,255,.02);}
    .mono{font-family:"JetBrains Mono",monospace;} .loc{color:var(--cyan);} .pos{color:var(--green);} .neg{color:var(--red);} .dim{color:var(--muted);}
    .badge{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap;}
    .b-PROMOTE,.v-beating{background:rgba(54,211,153,.16);color:var(--green);} .b-HOLD,.v-inline{background:rgba(139,147,167,.16);color:var(--muted);}
    .b-EXPLORE{background:rgba(46,230,214,.14);color:var(--cyan);} .b-SHRINK{background:rgba(245,166,35,.16);color:var(--amber);}
    .b-DISABLE,.v-below{background:rgba(255,84,112,.16);color:var(--red);}
    .sev{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:11px;padding:3px 8px;border-radius:6px;}
    .sev.ERROR{background:rgba(255,84,112,.15);color:var(--red);} .sev.WARN{background:rgba(245,166,35,.15);color:var(--amber);} .sev.INFO{background:rgba(139,147,167,.15);color:var(--muted);}
    .pbar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;min-width:64px;display:inline-block;vertical-align:middle;}
    .pbar>span{display:block;height:100%;}
    .spark{display:inline-flex;gap:2px;align-items:flex-end;height:22px;}
    .spark i{width:5px;border-radius:1px;display:inline-block;}
    .pill{font-family:"JetBrains Mono",monospace;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;}
    .empty{color:var(--muted);font-style:italic;padding:16px 0;}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
    .filters .chip{cursor:pointer;} .filters .chip.on{color:var(--txt);border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset;}
    footer{color:var(--muted);font-size:12px;margin-top:28px;font-family:"JetBrains Mono",monospace;}
    .hint{color:var(--muted);font-size:12px;margin:-6px 0 14px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="eyebrow">PropSniper · Live Machine Monitor</div>
        <h1>+EV Operations Command Center</h1>
        <div class="sub">Audit + windowed optimizer + community consensus, polled live from the machine.</div>
        <div class="meta">feed: <span id="ts">—</span> · last poll: <span id="poll">—</span> · next in <span id="cd">—</span>s · source: <span id="src" class="mono"></span></div>
      </div>
      <div class="live"><span class="pulse"></span><span>LIVE · 60s</span></div>
    </div>

    <div id="verdict" class="verdict"><span class="dot"></span><span id="verdict-txt">connecting…</span></div>
    <div class="cards" id="cards"></div>

    <div class="controls">
      <span class="seglabel">Window</span>
      <div class="seg" id="winseg"></div>
      <span class="seglabel" id="winhint"></span>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="view"></div>

    <footer>Feed <span class="mono">docs/feed.json</span> · schema v<span id="schemav">?</span> · refreshed by <span class="mono">run_machine.py</span></footer>
  </div>

  <script>
    const POLL_MS = 60000;
    const $ = (id) => document.getElementById(id);
    let FEED=null, WIN=null, TAB="optimizer", CD=60;
    const sortState = {optimizer:{key:"thompson",dir:-1}, community:{key:"delta_edge",dir:-1}};
    let sevFilter="ALL";

    const fmtPct=(x)=> (x>=0?"+":"")+(x*100).toFixed(1)+"%";
    const cls=(x)=> x>=0?"pos":"neg";
    const esc=(s)=> String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

    async function fetchFeed(){
      const r= await fetch("./feed.json?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) throw new Error("feed "+r.status); return r.json();
    }

    function header(){
      const a=FEED.audit||{};
      $("ts").textContent=FEED.generated_at||"—";
      $("src").textContent=(FEED.source&&FEED.source.configs)||"—";
      $("schemav").textContent=FEED.schema_version??"?";
      const code=a.exit_code??0;
      $("verdict").className="verdict v"+code;
      const s=a.summary||{};
      $("verdict-txt").innerHTML=(a.verdict||"UNKNOWN")+" · exit "+code+
        ` <small>${s.files_checked||0} files · ${s.rules_checked||0} rules · ${s.errors||0} err · ${s.warnings||0} warn</small>`;
      const cards=Object.entries(a.cards||{});
      $("cards").innerHTML=cards.map(([l,n])=>`<div class="card ${n>0?'alert':'ok'}"><div class="label">${esc(l)}</div><div class="num">${n}</div></div>`).join("")
        +`<div class="card ok"><div class="label">Rules Scanned</div><div class="num">${s.rules_checked||0}</div></div>`;
    }

    function winseg(){
      const wins=FEED.windows||["30d"];
      $("winseg").innerHTML=wins.map(w=>`<button data-w="${w}" class="${w===WIN?'on':''}">${w}</button>`).join("");
      $("winseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{WIN=b.dataset.w;render();});
      const map={"7d":"days","14d":"2 weeks","30d":"~1 month","90d":"~3 months","all":"all-time"};
      $("winhint").textContent="("+(map[WIN]||WIN)+")";
    }

    function tabsbar(){
      const defs=[["optimizer","Optimizer"],["community","Community vs Personal"],["audit","Audit Findings"]];
      $("tabs").innerHTML=defs.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}">${l}</button>`).join("");
      $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render();});
    }

    function sortRows(rows,st){
      const {key,dir}=st;
      return rows.slice().sort((a,b)=>{
        let x=a[key], y=b[key];
        if(typeof x==="string"){return dir*x.localeCompare(y);}
        return dir*((x??-1e9)-(y??-1e9));
      });
    }
    function th(label,key,st){
      const on=st.key===key; const arr=on?(st.dir<0?" ▼":" ▲"):"";
      return `<th class="sortable" data-k="${key}">${label}<span class="arrow">${arr}</span></th>`;
    }
    function wireSort(tableId,st){
      document.querySelectorAll(`#${tableId} th.sortable`).forEach(h=>h.onclick=()=>{
        const k=h.dataset.k; if(st.key===k) st.dir*=-1; else {st.key=k;st.dir=-1;} render();
      });
    }

    function sparkline(p){
      const wins=FEED.windows;
      return `<span class="spark">`+wins.map(w=>{
        const e=p.windows[w]; const v=e.post_mean; const h=Math.max(3,Math.min(22,Math.abs(v)*120+3));
        const col=v>=0?"var(--green)":"var(--red)";
        return `<i title="${w}: ${fmtPct(v)}" style="height:${h}px;background:${col};opacity:${w===WIN?1:.45}"></i>`;
      }).join("")+`</span>`;
    }

    function optimizerView(){
      const o=FEED.optimizer;
      if(!o||!o.proposals||!o.proposals.length) return `<div class="panel"><div class="empty">No optimizer feed (run with --bets).</div></div>`;
      const sw=o.summary_by_window[WIN]||{actions:{}};
      const chips=Object.entries(sw.actions||{}).map(([a,n])=>`<span class="chip"><b class="badge b-${a}" style="background:none;padding:0">${a}</b> ${n}</span>`).join("");
      const pr=o.params||{};
      const rows=o.proposals.map(p=>{const e=p.windows[WIN];return {
        rule_id:p.rule_id, market:(p.league||"")+" "+(p.market||""), n:e.n, edge:e.post_mean,
        p_bleeding:e.p_bleeding, action:e.action, stake:e.recommended_stake_abs,
        thompson:e.thompson_sample, _p:p, _e:e};});
      const sorted=sortRows(rows,sortState.optimizer);
      const st=sortState.optimizer;
      const body=sorted.map(r=>{
        const e=r._e;
        const pbColor=r.p_bleeding>=.75?"var(--red)":r.p_bleeding>=.5?"var(--amber)":"var(--green)";
        return `<tr>
          <td class="loc" title="${esc(r.rule_id)}">${esc(r._p.label||r.rule_id)}${r._p.orphan?'<span class="pill">orphan</span>':''}</td>
          <td class="dim">${esc(r.market)}</td>
          <td>${sparkline(r._p)}</td>
          <td class="mono">${r.n}</td>
          <td class="mono ${cls(r.edge)}">${fmtPct(r.edge)} <span class="dim">±${(e.post_sd*100).toFixed(1)}</span></td>
          <td><span class="pbar"><span style="width:${(r.p_bleeding*100).toFixed(0)}%;background:${pbColor}"></span></span> <span class="mono dim">${(r.p_bleeding*100).toFixed(0)}%</span></td>
          <td><span class="badge b-${r.action}">${r.action}</span></td>
          <td class="mono">${r.stake?("$"+r.stake.toLocaleString()):'<span class="dim">—</span>'}</td>
          <td class="dim">${esc(e.rationale)}</td></tr>`;}).join("");
      return `<div class="panel">
        <div class="chips">${chips} <span class="chip dim">bankroll $${(pr.bankroll||0).toLocaleString()}</span><span class="chip dim">kelly ${pr.kelly_mult}</span><span class="chip dim">σ ${pr.sigma}</span></div>
        <div class="hint">Edge sparkline = post_mean across ${FEED.windows.join("/")} (current window highlighted). Click headers to sort.</div>
        <table id="opttab"><thead><tr>
          ${th("Rule","rule_id",st)}${th("Market","market",st)}<th>Trend</th>${th("n","n",st)}${th("Edge ("+WIN+")","edge",st)}${th("P(bleed)","p_bleeding",st)}${th("Action","action",st)}${th("Stake","stake",st)}<th>Rationale</th>
        </tr></thead><tbody>${body}</tbody></table>
        <div class="hint">Advisory — config-mutating actions are human-gated and must re-pass /audit before deploy.</div>
      </div>`;
    }

    function communityView(){
      const c=FEED.community||{};
      if(c.status!=="connected") return `<div class="panel"><div class="empty">${esc(c.note||"Community source not connected.")}</div></div>`;
      const sum=c.summary||{};
      const chips=`<span class="chip"><b class="badge v-beating" style="background:none;padding:0">BEATING</b> ${sum.beating||0}</span>
        <span class="chip"><b class="badge v-inline" style="background:none;padding:0">INLINE</b> ${sum.inline||0}</span>
        <span class="chip"><b class="badge v-below" style="background:none;padding:0">BELOW</b> ${sum.below||0}</span>
        <span class="chip dim">source ${esc(c.source)} · as of ${esc(c.as_of)} · window ${esc(c.window)}</span>`;
      const st=sortState.community;
      const sorted=sortRows(c.comparison||[],st);
      const body=sorted.map(r=>`<tr>
        <td class="loc" title="${esc(r.rule_id)}">${esc(r.label||r.rule_id)}${r.orphan?'<span class="pill">orphan</span>':''}</td>
        <td class="dim">${esc((r.league||"")+" "+(r.market||""))}</td>
        <td class="mono ${cls(r.personal_edge)}">${fmtPct(r.personal_edge)}</td>
        <td class="mono ${cls(r.community_edge)}">${fmtPct(r.community_edge)}</td>
        <td class="mono ${cls(r.delta_edge)}"><b>${fmtPct(r.delta_edge)}</b></td>
        <td><span class="badge v-${r.verdict}">${r.verdict.toUpperCase()}</span></td>
        <td class="mono dim">${r.community_brier}</td>
        <td class="mono dim">${(r.community_hit_rate*100).toFixed(1)}%</td>
        <td class="mono dim">${r.personal_n} / ${r.community_n.toLocaleString()}</td></tr>`).join("");
      return `<div class="panel">
        <div class="chips">${chips}</div>
        <div class="hint">Personal edge (your bets, ${WIN}) vs community consensus per market. Δ = personal − community. Click headers to sort.</div>
        <table id="commtab"><thead><tr>
          ${th("Rule","rule_id",st)}${th("Market","market",st)}${th("Personal","personal_edge",st)}${th("Community","community_edge",st)}${th("Δ Edge","delta_edge",st)}${th("Verdict","verdict",st)}${th("Comm. Brier","community_brier",st)}${th("Hit rate","community_hit_rate",st)}<th>n (you/comm)</th>
        </tr></thead><tbody>${body}</tbody></table>
      </div>`;
    }

    function auditView(){
      const a=FEED.audit||{};
      const all=a.findings||[];
      const sevs=["ALL","ERROR","WARN","INFO"];
      const filt=all.filter(f=>sevFilter==="ALL"||f.severity===sevFilter);
      const order={ERROR:0,WARN:1,INFO:2};
      filt.sort((x,y)=>(order[x.severity]-order[y.severity])||x.check.localeCompare(y.check));
      const body=filt.length?filt.map(f=>{const loc=f.file+(f.rule_id?`::${f.rule_id}`:"");
        return `<tr><td><span class="sev ${f.severity}">${f.severity}</span></td><td class="mono">${esc(f.check)}</td><td class="mono loc">${esc(loc)}</td><td>${esc(f.message)}</td></tr>`;}).join("")
        :`<tr><td colspan="4" class="empty">No findings at this severity.</td></tr>`;
      return `<div class="panel">
        <div class="filters">${sevs.map(s=>`<span class="chip ${s===sevFilter?'on':''}" data-s="${s}">${s}</span>`).join("")}</div>
        <table><thead><tr><th>Severity</th><th>Check</th><th>Location</th><th>Message</th></tr></thead><tbody>${body}</tbody></table>
      </div>`;
    }

    function render(){
      if(!FEED) return;
      header(); winseg(); tabsbar();
      let html="";
      if(TAB==="optimizer") html=optimizerView();
      else if(TAB==="community") html=communityView();
      else html=auditView();
      $("view").innerHTML=html;
      if(TAB==="optimizer") wireSort("opttab",sortState.optimizer);
      if(TAB==="community") wireSort("commtab",sortState.community);
      if(TAB==="audit") document.querySelectorAll(".filters .chip").forEach(c=>c.onclick=()=>{sevFilter=c.dataset.s;render();});
    }

    async function tick(){
      try{ FEED=await fetchFeed(); if(WIN===null) WIN=FEED.default_window||"30d"; render(); CD=60; }
      catch(e){ $("verdict-txt").textContent="feed unavailable — "+e.message; }
      $("poll").textContent=new Date().toISOString().replace("T"," ").slice(0,19)+"Z";
    }
    tick();
    setInterval(tick,POLL_MS);
    setInterval(()=>{CD=Math.max(0,CD-1);$("cd").textContent=CD;},1000);
  </script>
</body>
</html>
